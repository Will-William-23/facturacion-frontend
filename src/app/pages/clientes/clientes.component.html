<div class="container mt-4">
  <h2 class="text-primary mb-4">Gestión de Clientes</h2>

  <div class="row">
    <!-- Formulario -->
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm border-primary">
        <div class="card-header bg-primary text-white">
          {{ editando ? 'Editar Cliente' : 'Nuevo Cliente' }}
        </div>
        <div class="card-body">
          <form (ngSubmit)="guardarCliente()">
            <div class="mb-2">
              <label>Cédula</label>
              <input type="text" class="form-control" [(ngModel)]="clienteForm.cedula" name="cedula" maxlength="10" required>
            </div>
            <div class="mb-2">
              <label>Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="clienteForm.nombre" name="nombre" required>
            </div>
            <div class="mb-2">
              <label>Apellido</label>
              <input type="text" class="form-control" [(ngModel)]="clienteForm.apellido" name="apellido" required>
            </div>
            <div class="mb-2">
              <label>Email</label>
              <input type="email" class="form-control" [(ngModel)]="clienteForm.email" name="email" required>
            </div>
            <div class="mb-3">
              <label>Dirección</label>
              <input type="text" class="form-control" [(ngModel)]="clienteForm.direccion" name="direccion" required>
            </div>
            
            <div class="d-grid gap-2">
              <button type="submit" class="btn" [ngClass]="editando ? 'btn-warning' : 'btn-success'">
                {{ editando ? 'Actualizar' : 'Guardar' }}
              </button>
              <button *ngIf="editando" type="button" class="btn btn-secondary" (click)="cancelarEdicion()">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabla con Buscador -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-light">
            <input type="text" class="form-control" placeholder="🔍 Buscar por nombre..." [(ngModel)]="searchText">
        </div>
        <div class="card-body">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- Aplicamos el Pipe: filter:searchText -->
              <tr *ngFor="let c of clientes | filter:searchText:'nombre'">
                <td>{{ c.cedula }}</td>
                <td>{{ c.nombre }} {{ c.apellido }}</td>
                <td>
                  <button class="btn btn-warning btn-sm me-2" (click)="editarCliente(c)">✏️</button>
                  <button class="btn btn-danger btn-sm" (click)="eliminarCliente(c.id)">🗑️</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  
</div>
