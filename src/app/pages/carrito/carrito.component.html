<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Carrito de Compras</h1>

    <div *ngIf="cartItems.length === 0" class="text-center py-10">
        <p class="text-xl text-gray-600 mb-4">Tu carrito está vacío.</p>
        <a routerLink="/catalogo" class="text-blue-600 hover:underline">Volver al catálogo</a>
    </div>

    <div *ngIf="cartItems.length > 0" class="bg-white rounded-lg shadow-lg overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-100 text-gray-700 uppercase text-sm leading-normal">
                    <th class="py-3 px-6">Producto</th>
                    <th class="py-3 px-6 text-center">Precio</th>
                    <th class="py-3 px-6 text-center">Cantidad</th>
                    <th class="py-3 px-6 text-center">Subtotal</th>
                    <th class="py-3 px-6 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody class="text-gray-600 text-sm font-light">
                <tr *ngFor="let item of cartItems" class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="py-3 px-6 whitespace-nowrap font-medium">{{ item.producto.nombre }}</td>
                    <td class="py-3 px-6 text-center">${{ item.producto.precio }}</td>
                    <td class="py-3 px-6 text-center">{{ item.cantidad }}</td>
                    <td class="py-3 px-6 text-center text-green-600 font-bold">${{ item.subtotal }}</td>
                    <td class="py-3 px-6 text-center">
                        <button (click)="eliminarItem(item.producto.id!)" class="text-red-500 hover:text-red-700">
                            🗑️ Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="p-6 bg-gray-50 flex justify-between items-center border-t border-gray-200">
            <button (click)="vaciarCarrito()" class="text-red-600 hover:text-red-800 font-semibold text-sm">
                Vaciar Carrito
            </button>
            <div class="text-right">
                <p class="text-lg text-gray-600">Total a Pagar:</p>
                <p class="text-3xl font-bold text-green-600">${{ total }}</p>
                <button (click)="comprar()"
                    class="mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow-lg transition duration-200">
                    Finalizar Compra
                </button>
            </div>
        </div>
    </div>
</div>
