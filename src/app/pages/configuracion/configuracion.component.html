<div class="container-fluid py-4" style="background-color: #f4f6f9; min-height: 100vh;">
  <div class="container">
    
    <!-- CABECERA -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-dark mb-0">Configuración Empresarial</h2>
        <small class="text-muted">Parámetros globales para facturación y reportes</small>
      </div>
      <div class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary px-3 py-2">
        <i class="bi bi-gear-fill me-2"></i>Ajustes del Sistema
      </div>
    </div>
  
    <div class="row justify-content-center">
      <div class="col-lg-10">
        
        <div class="card border-0 shadow h-100" style="border-top: 4px solid #6c757d !important;">
          <div class="card-header bg-white py-3 border-bottom-0">
            <h5 class="fw-bold m-0 text-secondary">
              <i class="bi bi-building me-2"></i>Datos de la Empresa
            </h5>
          </div>
          
          <div class="card-body pt-0">
            <form (ngSubmit)="guardar()">
              
              <!-- BLOQUE 1: IDENTIDAD -->
              <h6 class="text-muted text-uppercase small fw-bold mb-3 border-bottom pb-2">Información Legal</h6>
              
              <div class="row g-3 mb-4">
                <div class="col-md-8">
                  <label class="form-label small fw-bold text-secondary">Razón Social / Nombre Comercial</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shop"></i></span>
                    <input type="text" class="form-control border-start-0" [(ngModel)]="config.nombreEmpresa" name="nombre" placeholder="Ej: Mi Empresa S.A." required>
                  </div>
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold text-secondary">RUC</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-card-text"></i></span>
                    <input type="text" class="form-control border-start-0" [(ngModel)]="config.ruc" name="ruc" maxlength="13" placeholder="17..." required>
                  </div>
                </div>
              </div>

              <!-- BLOQUE 2: UBICACIÓN Y CONTACTO -->
              <h6 class="text-muted text-uppercase small fw-bold mb-3 border-bottom pb-2">Ubicación y Contacto</h6>
              
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Dirección Matriz</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                  <input type="text" class="form-control border-start-0" [(ngModel)]="config.direccion" name="dir" placeholder="Av. Principal y Calle Secundaria" required>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-4">
                  <label class="form-label small fw-bold text-secondary">Teléfono</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                    <input type="text" class="form-control border-start-0" [(ngModel)]="config.telefono" name="telf" placeholder="099...">
                  </div>
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold text-secondary">Email Corporativo</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" [(ngModel)]="config.email" name="email" placeholder="info@empresa.com">
                  </div>
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold text-secondary">Sitio Web</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-globe"></i></span>
                    <input type="text" class="form-control border-start-0" [(ngModel)]="config.sitioWeb" name="web" placeholder="www.sitio.com">
                  </div>
                </div>
              </div>

              <!-- BLOQUE 3: DATOS TRIBUTARIOS -->
              <h6 class="text-muted text-uppercase small fw-bold mb-3 border-bottom pb-2">Parámetros Tributarios (SRI)</h6>
              
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Obligado a Llevar Contabilidad</label>
                  <select class="form-select" [(ngModel)]="config.obligadoContabilidad" name="contabilidad">
                    <option value="NO">NO</option>
                    <option value="SI">SI</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">IVA Vigente (%)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-percent"></i></span>
                    <input type="number" class="form-control border-start-0" [(ngModel)]="config.ivaPorcentaje" name="iva" step="0.1" placeholder="15">
                  </div>
                  <div class="form-text small">Este valor se aplicará a los productos que graban IVA.</div>
                </div>
              </div>

              <!-- BOTONES DE ACCIÓN -->
              <div class="d-flex justify-content-end gap-2 border-top pt-4">
                <a routerLink="/dashboard" class="btn btn-light border text-secondary px-4">
                  <i class="bi bi-x-lg me-1"></i> Cancelar
                </a>
                <button type="submit" class="btn btn-dark px-4 shadow-sm">
                  <i class="bi bi-save me-1"></i> Guardar Cambios
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
