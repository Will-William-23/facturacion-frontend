<div class="d-flex" id="wrapper">

    <!-- SIDEBAR RETRÁCTIL (Clase cambiada a 'sidebar-wrapper') -->
    <div class="sidebar-wrapper text-white border-end border-secondary">

        <div class="sidebar-heading p-4 border-bottom border-secondary bg-dark">
            <div class="d-flex align-items-center mb-3">
                <div class="bg-primary rounded-circle p-2 me-2 d-flex justify-content-center align-items-center"
                    style="width: 40px; height: 40px;">
                    <i class="bi bi-grid-3x3-gap-fill text-white"></i>
                </div>
                <span class="fw-bold fs-5">ERP System</span>
            </div>
            <div class="small text-white-50">
                <i class="bi bi-person-circle me-1"></i> {{ usuario }}
                <br>
                <span class="badge bg-secondary mt-1">{{ rolEtiqueta }}</span>
            </div>
        </div>

        <div class="list-group list-group-flush p-2">

            <!-- DASHBOARD -->
            <button (click)="navegar('/dashboard', [])"
                class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                <i class="bi bi-speedometer2 me-2 text-primary"></i> Monitor en Vivo
            </button>

            <!-- TIENDA (Solo Clientes) -->
            <button *ngIf="canShop" (click)="navegar('/tienda', ['CLIENTE'])"
                class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-warning border-0 rounded mb-1 text-start">
                <i class="bi bi-shop me-2"></i> Ir a la Tienda
            </button>

            <div *ngIf="!esCliente">
                <small class="text-uppercase text-white-50 ms-3 mt-3 d-block"
                    style="font-size: 0.7rem;">Operaciones</small>

                <button (click)="navegar('/facturacion', ['ADMIN', 'VENDEDOR'])"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                    <i class="bi bi-receipt me-2"></i> Nueva Venta
                </button>

                <button (click)="navegar('/clientes', ['ADMIN', 'VENDEDOR'])"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                    <i class="bi bi-people me-2"></i> Clientes
                </button>

                <button (click)="navegar('/productos', ['ADMIN', 'VENDEDOR'])"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                    <i class="bi bi-box-seam me-2"></i> Inventario
                </button>

                <!-- NUEVOS: CATÁLOGO Y CARRITO (Para Pedrito) -->
                <button (click)="navegar('/catalogo', ['ADMIN', 'VENDEDOR'])"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                    <i class="bi bi-journal-bookmark me-2"></i> Catálogo
                </button>
                <button (click)="navegar('/carrito', ['ADMIN', 'VENDEDOR'])"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                    <i class="bi bi-cart3 me-2"></i> Carrito
                </button>

                <small class="text-uppercase text-white-50 ms-3 mt-3 d-block" style="font-size: 0.7rem;">Gestión</small>

                <button (click)="navegar('/historial', ['ADMIN', 'VENDEDOR', 'CONTADOR'])"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                    <i class="bi bi-clock-history me-2"></i> Historial
                </button>

                <button (click)="navegar('/proveedores', ['ADMIN', 'CONTADOR'])"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                    <i class="bi bi-truck me-2"></i> Proveedores
                </button>

                <div *ngIf="esAdmin">
                    <small class="text-uppercase text-white-50 ms-3 mt-3 d-block"
                        style="font-size: 0.7rem;">Admin</small>
                    <button (click)="navegar('/usuarios', ['ADMIN'])"
                        class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                        <i class="bi bi-shield-lock me-2 text-danger"></i> Seguridad
                    </button>
                    <button (click)="navegar('/configuracion', ['ADMIN'])"
                        class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                        <i class="bi bi-gear me-2"></i> Configuración
                    </button>
                </div>
            </div>

            <div class="mt-4 border-top border-secondary pt-2">
                <button (click)="navegar('/contactanos', [])"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-white border-0 rounded mb-1 text-start">
                    <i class="bi bi-headset me-2"></i> Soporte
                </button>
                <button (click)="logout()"
                    class="list-group-item list-group-item-action list-group-item-dark bg-transparent text-danger border-0 rounded mt-2 text-start">
                    <i class="bi bi-box-arrow-left me-2"></i> Cerrar Sesión
                </button>
            </div>

        </div>
    </div>
    <!-- CONTENIDO PRINCIPAL -->
    <div id="page-content-wrapper">
        <div class="container-fluid p-0">
            <router-outlet></router-outlet>
        </div>
    </div>

</div>
